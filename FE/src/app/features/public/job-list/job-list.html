<div class="page-container">
  <div class="page-header">
    <h2>Latest Job Openings</h2>
    <p>Discover opportunities and take the next step in your career.</p>
  </div>

  <div class="job-grid">
    <div class="job-card" *ngFor="let job of jobs">
      <div class="job-card-header">
        <div>
          <h3 class="job-title">{{ job.title }}</h3>
          <p class="job-company" *ngIf="job.company">🏢 {{ job.company }}</p>
        </div>
        <span class="job-type-badge">{{ job.locationType }}</span>
      </div>

      <p class="job-location">📍 {{ job.location }}</p>

      <div class="job-card-footer">
        <a [routerLink]="['/jobs', job.id]" class="btn-primary-outline">View Details</a>
      </div>
    </div>
  </div>
</div>
