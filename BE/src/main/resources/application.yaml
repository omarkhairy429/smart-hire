spring:
  config:
    import: "optional:file:../.env[.properties]"
  application:
    name: smart-hire
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smarthire}
    username: ${DB_USER:smarthire}
    password: ${DB_PASSWORD:smart123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:X7v3k9Qp2N8mZ6wJ4tR1yB5cV0sD3fH8gK7lM2nO9pQ6rT4uW1xY5zA3bC0eG7hJ}